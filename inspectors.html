<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

<title>زي المفتشين</title>

<style>
body {
margin: 0;
font-family: Arial, sans-serif;
background: #f4f7fb;
color: #12345b;
}

.header {
background: #123f70;
color: white;
padding: 25px;
text-align: center;
}

.container {
max-width: 900px;
margin: 30px auto;
padding: 20px;
}

.type {
background: white;
padding: 25px;

border-radius: 18px;

}

}

.item {

align-items: center;
padding: 15px 0;
border-bottom: 1px solid #e5ebf2;
}

.item:last-child {
border-bottom: none;
}

select,
input {
padding: 10px;
border: 1px solid #ccd6e3;
border-radius: 8px;
font-size: 15px;
min-width: 130px;
}

button {
background: #123f70;
color: white;
border: none;
padding: 14px 30px;
border-radius: 10px;
font-size: 16px;
cursor: pointer;
}

.back {
display: inline-block;
margin-bottom: 20px;
color: #123f70;
text-decoration: none;
font-weight: bold;
}

.submit {
