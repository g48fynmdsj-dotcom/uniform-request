<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>سلة الطلب</title>

<style>

body {
margin: 0;
font-family: Arial, sans-serif;
background: #f4f7fb;
color: #12345b;
}

.container {
max-width: 800px;
margin: 40px auto;
padding: 20px;
}

.header {
display: flex;
justify-content: space-between;
align-items: center;
margin-bottom: 25px;
}

.back {
background: #123f70;
color: white;
text-decoration: none;
padding: 10px 18px;
border-radius: 10px;
}

.cart-box {
background: white;
padding: 25px;
border-radius: 18px;
box-shadow: 0 4px 18px #d8e0ea;
}

.item {
display: flex;
justify-content: space-between;
align-items: center;
padding: 18px 0;
border-bottom: 1px solid #e5eaf0;
gap: 15px;
}

.item:last-child {
border-bottom: none;
}

.item-info {
line-height: 1.8;
}

.delete {
background: #a52a2a;
color: white;
border: none;
padding: 9px 15px;
border-radius: 8px;
cursor: pointer;
}

.confirm {
width: 100%;
margin-top: 25px;
background: #123f70;
color: white;
border: none;
padding: 16px;
border-radius: 10px;
font-size: 17px;
cursor: pointer;
}

.empty {
text-align: center;
padding: 50px 10px;
font-size: 20px;
}

</style>

</head>

<body>

<div class="container">

<div class="header">

<h1>🛒 سلة الطلب</h1>

<a href="index.html" class="back">
العودة للرئيسية
</a>

</div>

<div class="cart-box">

<div id="cartItems"></div>

<button
class="confirm"
onclick="confirmOrder()">

تأكيد وإرسال الطلب

</button>

</div>

</div>


<script>

function getCart() {

return JSON.parse(
localStorage.getItem("uniformCart")
) || [];

}


function displayCart() {

const cart = getCart();

const container =
document.getElementById("cartItems");

if (cart.length === 0) {

container.innerHTML = `
<div class="empty">
السلة فارغة 🛒
</div>
`;

return;
}

container.innerHTML = "";

cart.forEach((item, index) => {

const div =
document.createElement("div");

div.className = "item";

div.innerHTML = `

<div class="item-info">

<strong>
${item.name || item.product || "الزي الرسمي"}
</strong>

<br>

${item.size ? "المقاس: " + item.size : ""}

${item.type ? "<br>النوع: " + item.type : ""}

</div>

<button
class="delete"
onclick="deleteItem(${index})">

حذف

</button>

`;

container.appendChild(div);

});

}


function deleteItem(index) {

const cart = getCart();

cart.splice(index, 1);

localStorage.setItem(
"uniformCart",
JSON.stringify(cart)
);

displayCart();

}


function createOrderNumber() {

const now = new Date();

const year =
now.getFullYear();

const month =
String(now.getMonth() + 1)
.padStart(2, "0");

const day =
String(now.getDate())
.padStart(2, "0");

const random =
Math.floor(
1000 + Math.random() * 9000
);

return `UR-${year}${month}${day}-${random}`;

}


function confirmOrder() {

const cart = getCart();

if (cart.length === 0) {

alert("السلة فارغة 🛒");

return;

}


const orderNumber =
createOrderNumber();


const orders =
JSON.parse(
localStorage.getItem("uniformOrders")
) || [];


const order = {

orderNumber: orderNumber,

date: new Date().toLocaleString(
"ar-AE"
),

status: "جديد",

items: cart

};


orders.push(order);


localStorage.setItem(
"uniformOrders",
JSON.stringify(orders)
);


// تفريغ السلة

localStorage.removeItem(
"uniformCart"
);


// إظهار رقم الطلب

alert(
"تم إرسال الطلب بنجاح ✅\n\n" +
"رقم الطلب:\n" +
orderNumber
);


// العودة للرئيسية

window.location.href =
"index.html";

}


displayCart();

</script>

</body>

</html>
