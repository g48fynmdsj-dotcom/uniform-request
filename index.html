
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نظام طلب الزي الرسمي</title>

<style>
body {
margin: 0;
font-family: Arial, sans-serif;
background: #f4f7fb;
color: #12345b;
}

.login {
max-width: 420px;
margin: 100px auto;
background: white;
padding: 40px;
border-radius: 20px;
box-shadow: 0 5px 25px #ccd6e3;
text-align: center;
}

h1 { margin-bottom: 30px; }

input {
width: 90%;
padding: 15px;
margin: 8px;
border: 1px solid #ccd6e3;
border-radius: 10px;
font-size: 16px;
}

button {
background: #123f70;
color: white;
border: 0;
padding: 14px 35px;
border-radius: 10px;
font-size: 16px;
cursor: pointer;
}

.home {
display: none;
padding: 30px;
}

.cards {
display: grid;
grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
gap: 20px;
margin-top: 30px;
}

.card {
background: white;
padding: 30px;
border-radius: 18px;
box-shadow: 0 3px 15px #d8e0ea;
text-align: center;
font-size: 20px;
}
</style>
</head>

<body>

<div class="login" id="login">
<h1>نظام طلب الزي الرسمي</h1>

<input id="employee" placeholder="رقم الموظف">
<input id="password" type="password" placeholder="كلمة المرور">

<br><br>

<button onclick="login()">تسجيل الدخول</button>

<p>نسيت كلمة المرور؟</p>
</div>

<div class="home" id="home">
<h1>نظام طلب الزي الرسمي</h1>
<p>مرحباً بك 👋</p>

<div class="cards">
<a href="inspectors.html" class="card">👔<br>زي المفتشين</a>
<a href="inspectors-women.html" class="card">👗<br>زي المفتشات</a>

<div class="card">📋<br>طلباتي</div>
<div class="card">🔔<br>الإشعارات</div>
</div>
</div>

<script>
function login() {
if (document.getElementById("employee").value &&
document.getElementById("password").value) {
document.getElementById("login").style.display = "none";
document.getElementById("home").style.display = "block";
} else {
alert("يرجى إدخال رقم الموظف وكلمة المرور");
}


}
</script>

</body>
</html>
