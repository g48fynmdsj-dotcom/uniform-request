<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>نظام طلب الزي الرسمي</title>

<style>

body {
margin: 0;
font-family: Arial, sans-serif;
background: #f4f7fb;
color: #12345b;
}

.login {
max-width: 420px;
margin: 100px auto;
background: white;
padding: 40px;
border-radius: 20px;
box-shadow: 0 5px 25px #ccd6e3;
text-align: center;
}

h1 {
margin-bottom: 30px;
}

input {
width: 90%;
padding: 15px;
margin: 8px;
border: 1px solid #ccd6e3;
border-radius: 10px;
font-size: 16px;
box-sizing: border-box;
}

button {
background: #123f70;
color: white;
border: 0;
padding: 14px 35px;
border-radius: 10px;
font-size: 16px;
cursor: pointer;
}

.home {
display: none;
padding: 30px;
}

.top-buttons {
display: grid;
grid-template-columns: repeat(2, 1fr);
gap: 15px;
margin: 25px 0;
}

.top-button {
background: white;
padding: 18px;
border-radius: 15px;
box-shadow: 0 3px 15px #d8e0ea;
text-align: center;
font-size: 18px;
font-weight: bold;
color: #123f70;
text-decoration: none;
}

.cards {
display: grid;
grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
gap: 20px;
margin-top: 30px;
}

.card {
background: white;
padding: 30px;
border-radius: 18px;
box-shadow: 0 3px 15px #d8e0ea;
text-align: center;
font-size: 20px;
text-decoration: none;
color: #12345b;
cursor: pointer;
}

.card:hover,
.top-button:hover {
transform: translateY(-2px);
}

.cart-count {
background: #123f70;
color: white;
padding: 3px 9px;
border-radius: 15px;
font-size: 14px;
}

</style>

</head>

<body>

<!-- تسجيل الدخول -->

<div class="login" id="login">

<h1>
نظام طلب الزي الرسمي
</h1>

<input
id="employee"
placeholder="رقم الموظف"
>

<input
id="password"
type="password"
placeholder="كلمة المرور"
>

<br><br>

<button onclick="login()">
تسجيل الدخول
</button>

<p>
نسيت كلمة المرور؟
</p>

</div>


<!-- الصفحة الرئيسية -->

<div class="home" id="home">

<h1>
نظام طلب الزي الرسمي
</h1>

<p>
مرحباً بك 👋
</p>


<!-- السلة وطلباتي -->

<div class="top-buttons">

<a
href="cart.html"
class="top-button">

🛒 السلة

<span
class="cart-count"
id="cartCount">

0

</span>

</a>


<a
href="orders.html"
class="top-button">

📋 طلباتي

</a>

</div>


<!-- الأقسام -->

<div class="cards">

<a
href="inspectors.html"
class="card">

👔

<br>

زي المفتشين

</a>


<a
href="inspectors-woman.html"
class="card">

👗

<br>

زي المفتشات

</a>


<div
class="card"
onclick="showNotifications()">

🔔

<br>

الإشعارات

</div>


</div>

</div>


<script>

function login() {

let employee =
document.getElementById("employee").value;

let password =
document.getElementById("password").value;


if (employee && password) {

document.getElementById("login")
.style.display = "none";

document.getElementById("home")
.style.display = "block";

updateCartCount();

} else {

alert(
"يرجى إدخال رقم الموظف وكلمة المرور"
);

}

}


function updateCartCount() {

let cart =
JSON.parse(
localStorage.getItem("uniformCart")
) || [];


document.getElementById(
"cartCount"
).innerText = cart.length;

}


function showNotifications() {

alert(
"لا توجد إشعارات جديدة 🔔"
);

}

</script>

</body>

</html>
